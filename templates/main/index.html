<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Shop_1</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Shop_1</a>

        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="#">Asosiy</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="#">Shop</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->
    <div class="container mt-5">
      <!-- Buttons -->
      <div class="d-flex gap-3">
        {% for i in category %}
          <button class="btn btn-success">{{ i.name }}</button>
        {% endfor %}
      </div>

      <h2 style="text-align: center;margin-top: 20px;"><b>Mahsulotlar</b></h2>

      <div class="row">
        {% for i in product %}
          <div class="col-4 mt-5">
            <div class="card" style="width: 18rem;">
              <img class="card-img-top" src="{{ i.image.url }}" alt="Card image cap" />
              <div class="card-body">
                <h5 class="card-title">{{ i.name }}</h5>
                <p class="card-text">{{ i.text }} <br> <b>{{ i.price }} $</b></p>
                <a href="#" class="btn btn-primary">Keyingisi</a>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>

      <div class="d-flex gap-3 mt-5">
        {% for i in category %}
          <button class="btn btn-success">{{ i.name }}</button>
        {% endfor %}
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
