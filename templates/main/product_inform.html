<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Shop_1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'index' %}">Shop_1</a>

        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="{% url 'index' %}">Asosiy</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h5 style="text-align: center; font-size: 100px;">{{ product_info.categories.name }}</h5>
      <div class="row">
        <div class="col-6">
          <img style="width: 400px;" src="{{ product_info.image.url }}" alt="" />
        </div>
        <div class="col-6">
          <div class="jumbotron">
            <h1 class="display-4">{{ product_info.name }}</h1>
            <p class="lead">
              {{ product_info.text }} <br /> {{ product_info.price }} $
            </p>
            <hr class="my-4" />
            <a class="btn btn-primary btn-lg" href="#" role="button">Savatga Joylash</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
